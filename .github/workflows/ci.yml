name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_ROLL_FORWARD: LatestMajor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Godot 4.7.2 (mono, headless)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-mono: true

      - name: Locate Godot binary
        run: |
          BIN="$(command -v godot || command -v godot-mono || true)"
          if [ -z "$BIN" ]; then
            BIN="$(find "$HOME" "$RUNNER_TOOL_CACHE" -maxdepth 5 -name 'Godot*' -type f 2>/dev/null | head -1)"
          fi
          [ -n "$BIN" ] || { echo "Godot binary not found"; exit 1; }
          echo "GODOT_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version

      - name: Run quality gate
        run: bash tools/ci.sh
