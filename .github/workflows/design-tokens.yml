name: Design Token Sync

on:
  repository_dispatch:
    types: [figma_tokens_changed]
  workflow_dispatch:
    inputs:
      tokens_json:
        description: 'Raw tokens JSON (for manual trigger)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-pr:
    name: Sync Tokens & Create PR
    runs-on: [self-hosted, macos, gpu]
    timeout-minutes: 20
    env:
      GODOT_BIN: /Applications/Godot.app/Contents/MacOS/Godot
      # The design_token_sync and visual_qa packages live in their skill
      # directories, not on sys.path.
      PYTHONPATH: ${{ github.workspace }}/.claude/skills/ecc/design-token-sync:${{ github.workspace }}/.claude/skills/ecc/visual-qa
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .claude/skills/ecc/design-token-sync/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r .claude/skills/ecc/design-token-sync/requirements.txt
          pip install -r .claude/skills/ecc/visual-qa/requirements.txt
          pip install pytest

      # Order matters: "before" is the committed theme, so capture it before
      # the payload rewrites design/tokens.json.
      - name: Capture UI shots (before the token change)
        run: |
          python -m design_token_sync.capture_panels --before

      - name: Extract tokens from webhook
        id: extract
        run: |
          python -m design_token_sync.figma_webhook --write
          echo "tokens_written=true" >> $GITHUB_OUTPUT

      - name: Sync tokens + rebuild the theme
        run: |
          python -m design_token_sync.sync_tokens_extended --write

      - name: Token, contrast and theme checks
        run: |
          python -m pytest tests/test_theme_tokens.py -q
          python .claude/skills/ecc/design-token-sync/design_token_sync/drift_check.py
          python tools/a11y_audit.py

      - name: Capture UI shots (after)
        run: |
          python -m design_token_sync.capture_panels --after

      # 25 = the harness's measured run-to-run noise floor (visual_qa/config.py).
      - name: Visual regression diff
        id: visual_diff
        run: |
          python -m design_token_sync.visual_diff --threshold 25 || echo "DIFF_FAILED=true" >> $GITHUB_OUTPUT

      - name: Generate visual diff gallery
        if: always()
        run: |
          python -m visual_qa.gallery

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: design-tokens/sync-${{ github.sha }}
          delete-branch: true
          title: 'chore(design): sync tokens from Figma'
          body: |
            ## Design Token Sync
            
            Auto-generated PR from Figma webhook (`figma_tokens_changed`).
            
            **Changes:**
            - Synced `design/tokens.json` → `godot/theme/tokens.json`
            - Rebuilt the generated theme (`godot/theme/lakskongen_theme.tres`, `lakskongen_chart_theme.tres`, fonts) via headless Godot
            - Token, contrast and theme tests; visual regression on the 16 UI shots (01-07g)
            
            **Visual QA:**
            ${{ steps.visual_diff.outputs.DIFF_FAILED == 'true' && '⚠️ Visual regression detected — see diff gallery below' || '✅ All panels match baseline' }}
            
            <details>
            <summary>Visual Diff Gallery</summary>
            
            ${{ github.workspace }}/visual_qa_gallery.md
            
            </details>
            
            **Trigger:** Figma webhook / Manual dispatch
            **Commit:** ${{ github.sha }}

      # A dispatch event carries no pull request: comment on the one the
      # create-pull-request step opened (or updated).
      - name: Comment visual diff on PR
        if: always() && steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('visual_qa_gallery.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: '## Visual QA Report (Design Token Sync)\n\n' + body
            });

      - name: Fail if visual regression
        if: steps.visual_diff.outputs.DIFF_FAILED == 'true'
        run: |
          echo "::error::Visual regression detected in design token sync — see PR comment for diff gallery"
          exit 1