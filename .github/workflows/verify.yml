name: verify

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    # 45, not 30 (geo stages 2-3 ruling OD15, RUN_LOG §7): PRs #5 and #6 took
    # 26:14 and 27:21, so any added test risked a timeout that reads as a failure.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build LakskongenSim.sln --nologo
      - run: dotnet test LakskongenSim.sln --no-build --nologo
        env:
          DOTNET_ROLL_FORWARD: LatestMajor

  # F2-01 (docs/GOLDEN_TRACES.md): a pull request must leave the shipped-scenario
  # golden traces unchanged (FARM_TYPES_SPEC §7 standing sim gate). The merge
  # base and the head are both recorded on this runner, so the verdict does not
  # depend on the platform's math library. A PR that changes the game on purpose
  # fails here by design and carries the re-recorded fixtures and this report.
  golden-traces:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - name: Record the merge base and the head, and diff them
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(git merge-base HEAD "origin/$BASE_REF")"
          if ! git cat-file -e "$base:src/StateHashProbe/GoldenTraceRecorder.cs" 2>/dev/null; then
            echo "The merge base predates the golden-trace harness: nothing to compare."
            exit 0
          fi
          status=0
          bash tools/record_golden_traces.sh --base "$base" --out "$RUNNER_TEMP/golden" \
            --report "$RUNNER_TEMP/golden_diff.md" || status=$?
          if [ -f "$RUNNER_TEMP/golden_diff.md" ]; then cat "$RUNNER_TEMP/golden_diff.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit $status

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # pytest was never installed here, so this job could not pass (F176).
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q
