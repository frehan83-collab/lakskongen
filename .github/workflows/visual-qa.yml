name: Visual QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-qa:
    name: Visual QA Diff
    runs-on: [self-hosted, macos, gpu]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Capture current screenshots (PR head)
        run: |
          tools/capture_screenshots.sh
          python -m visual_qa.capture

      - name: Fetch main branch baseline
        run: |
          git fetch origin main
          git checkout origin/main -- godot/screenshots/baseline/

      - name: Diff current vs baseline
        id: diff
        run: |
          python -m visual_qa.diff --fail-on-diff || echo "DIFF_FAILED=true" >> $GITHUB_OUTPUT

      - name: Generate diff gallery
        if: always()
        run: python -m visual_qa.gallery

      - name: Comment on PR with diff gallery
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('visual_qa_gallery.md', 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      - name: Fail job if visual regression detected
        if: steps.diff.outputs.DIFF_FAILED == 'true'
        run: |
          echo "::error::Visual regression detected — see PR comment for diff gallery"
          exit 1