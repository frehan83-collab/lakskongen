name: Visual QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-qa:
    name: Visual QA Diff
    # Self-hosted Mac (Godot needs a GPU session to render). Pull requests
    # from forks never run here: their code would execute on that machine.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macos, gpu]
    timeout-minutes: 30
    env:
      # The visual_qa package lives in the skill directory, not on sys.path.
      PYTHONPATH: ${{ github.workspace }}/.claude/skills/ecc/visual-qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .claude/skills/ecc/visual-qa/requirements.txt

      # There is no root requirements.txt; the skill pins its own.
      - name: Install dependencies
        run: |
          pip install -r .claude/skills/ecc/visual-qa/requirements.txt

      # capture_screenshots.sh exits non-zero when a content check fails
      # (e.g. a mostly black underwater frame); capture then copies the shots
      # over the working-tree baseline, which the next step replaces with main's.
      - name: Capture current screenshots (PR head)
        run: |
          tools/capture_screenshots.sh
          python -m visual_qa.capture --skip-harness

      - name: Fetch main branch baseline
        run: |
          git fetch origin main
          git checkout origin/main -- godot/screenshots/baseline/

      - name: Diff current vs baseline
        id: diff
        run: |
          python -m visual_qa.diff --fail-on-diff || echo "DIFF_FAILED=true" >> $GITHUB_OUTPUT

      - name: Generate diff gallery
        if: always()
        run: python -m visual_qa.gallery

      - name: Comment on PR with diff gallery
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('visual_qa_gallery.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      - name: Fail job if visual regression detected
        if: steps.diff.outputs.DIFF_FAILED == 'true'
        run: |
          echo "::error::Visual regression detected — see PR comment for diff gallery"
          exit 1
