<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='700' viewBox='0 0 1000 700'>
  <rect width='100%' height='100%' fill='#F8FAFC'/>
  <g transform='translate(40,40)'>
    <text x='0' y='24' font-family='Arial' font-size='18' font-weight='700' fill='#0F172A'>Create Contract Offer</text>
    <rect x='0' y='40' width='640' height='540' rx='8' fill='#FFFFFF' stroke='#E6EAF0'/>

    <text x='16' y='76' font-size='13' fill='#64748B'>Product</text>
    <rect x='16' y='86' width='300' height='36' rx='6' fill='#F8FAFC' stroke='#E2E8F0'/>
    <text x='24' y='110' font-size='13' fill='#0F172A'>Smoked Fillet</text>

    <text x='340' y='76' font-size='13' fill='#64748B'>Quality Grade</text>
    <rect x='340' y='86' width='280' height='36' rx='6' fill='#F8FAFC' stroke='#E2E8F0'/>
    <text x='348' y='110' font-size='13' fill='#0F172A'>A — Premium (no bones)</text>

    <text x='16' y='140' font-size='13' fill='#64748B'>Quantity (kg)</text>
    <rect x='16' y='150' width='180' height='36' rx='6' fill='#FFFFFF' stroke='#E6EAF0'/>
    <text x='28' y='174' font-size='13' fill='#0F172A'>2000</text>

    <text x='220' y='140' font-size='13' fill='#64748B'>Price / kg</text>
    <rect x='220' y='150' width='180' height='36' rx='6' fill='#FFFFFF' stroke='#E6EAF0'/>
    <text x='232' y='174' font-size='13' fill='#0F172A'>$6.50</text>

    <text x='16' y='200' font-size='13' fill='#64748B'>Delivery Window</text>
    <rect x='16' y='210' width='300' height='36' rx='6' fill='#F8FAFC' stroke='#E2E8F0'/>
    <text x='24' y='234' font-size='13' fill='#0F172A'>2026-04-01 — 2026-04-05</text>

    <text x='16' y='260' font-size='13' fill='#64748B'>Penalties</text>
    <rect x='16' y='270' width='600' height='80' rx='6' fill='#FFF7F7' stroke='#FFE4E4'/>
    <text x='28' y='296' font-size='12' fill='#FF6B6B'>Late delivery: 2% per day</text>
    <text x='28' y='316' font-size='12' fill='#FF6B6B'>Quality failure: replace or refund</text>

    <rect x='16' y='370' width='220' height='44' rx='8' fill='#0077B6'/>
    <text x='126' y='400' font-size='14' fill='#FFFFFF' text-anchor='middle'>Create Offer</text>

    <rect x='260' y='370' width='220' height='44' rx='8' fill='#E6EAF0'/>
    <text x='370' y='400' font-size='14' fill='#0F172A' text-anchor='middle'>Preview</text>

  </g>
